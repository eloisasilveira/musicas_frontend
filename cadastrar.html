<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Música • SoundVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <div class="aurora-bg" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
    </div>

    <main class="form-container">
        <a class="voltar" href="index.html">← Voltar para a lista</a>
        <span class="form-tag">NOVO REGISTRO</span>
        <h1>Cadastrar <span class="serif-italic">música</span></h1>

        <div class="campo">
            <label for="titulo">Título da faixa</label>
            <input type="text" id="titulo" placeholder="Ex: Evidências">
        </div>

        <div class="campo">
            <label for="artista">Artista / Banda</label>
            <input type="text" id="artista" placeholder="Ex: Chitãozinho e Xororó">
        </div>

        <div class="campo">
            <label for="genero">Gênero musical</label>
            <input type="text" id="genero" placeholder="Ex: Sertanejo">
        </div>

        <div class="campo-duplo">
            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="ano" placeholder="1990">
            </div>

            <div class="campo">
                <label for="duracao">Duração (min)</label>
                <input type="number" id="duracao" placeholder="5">
            </div>
        </div>

        <button id="botaoCadastrar">CADASTRAR MÚSICA</button>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
