<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Música • SOUNDVAULT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="editar.css">
</head>
<body>
    <div class="ambient-backdrop" aria-hidden="true">
        <div class="fluid-ribbon-layer">
            <div class="neon-ribbon ribbon-cyan-diag"></div>
            <div class="neon-ribbon ribbon-sapphire-loop"></div>
        </div>
    </div>

    <main class="form-container">
        <a class="voltar" href="index.html">← Voltar para a lista</a>
        <span class="form-tag">ATUALIZAR FAIXA • CLOUD CRUD</span>
        <h1>Editar <em>música</em></h1>

        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo">
        </div>

        <div class="campo">
            <label for="artista">Artista</label>
            <input type="text" id="artista">
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero">
        </div>

        <div class="campo-duplo">
            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="ano">
            </div>

            <div class="campo">
                <label for="duracao">Duração em minutos</label>
                <input type="number" id="duracao">
            </div>
        </div>

        <button id="botaoSalvar">Salvar alterações</button>
    </main>

    <script src="editar.js"></script>
</body>
</html>
